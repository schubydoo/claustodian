name: OSV-Scanner

# Scan the committed package-lock.json against the OSV database (osv.dev) and
# upload SARIF to Security > Code scanning. Complements Dependabot: a broader
# advisory corpus, scanning the *resolved* lockfile rather than manifest ranges.
# Report-only for now (fail-on-vuln: false) so findings surface without blocking
# merges — flip to blocking once the signal is tuned. NOT wired into the
# `security required checks passed` aggregator (a separate workflow can't feed
# another's `needs:`), matching clauster: this is a signal job, not a gate.
#
# The OSV reusable workflow is SHA-PINNED (GitHub's own recommendation); Renovate
# tracks the pin via the trailing `# vX.Y.Z` comment.

on:
  pull_request:
    # Trimmed off the synchronize storm; this PR scan is report-only and overlaps
    # dependency-review on manifest CVEs. push:main + weekly cron are the real scan.
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: '27 5 * * 1' # weekly full scan, Monday 05:27 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny at the workflow level; each job grants only what it needs.
permissions: {}

concurrency:
  group: osv-scanner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Diff-aware scan on PRs: reports only the vulnerabilities the PR introduces.
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      fail-on-vuln: false # report-only signal for now; flip to blocking once tuned
    permissions:
      security-events: write # upload the SARIF to Security > Code scanning
      contents: read # checkout + read the lockfile
      actions: read # read run metadata for the SARIF upload

  # Full scan on a schedule, on pushes to main, and on manual dispatch, via the
  # reusable full-scan workflow (SHA-pinned, like scan-pr above).
  #
  # This ran the OSV-Scanner BINARY directly for a while, because the reusable
  # workflow referenced a tag-pinned actions/download-artifact internally, which a
  # require-SHA-pin policy rejects TRANSITIVELY at action-resolution time — the
  # step never runs, but it still has to resolve. Upstream SHA-pinned it in
  # v2.5.0, so every `uses:` in osv-scanner-reusable.yml now resolves to a
  # full-length SHA and the workaround is gone, along with the hand-maintained
  # sha256 that had to be bumped by hand on every release.
  #
  # That property holds per-release, not forever. If a Renovate bump of this pin
  # ever fails at action-resolution time, upstream re-tagged an internal action:
  # check every `uses:` in osv-scanner-reusable.yml at the new SHA before
  # concluding anything else.
  #
  # Two properties of the deleted binary block do not survive the swap and cannot
  # be set at the caller: the SARIF `category: osv-scanner` (the reusable workflow
  # passes only `sarif_file:` and exposes no category input) and `timeout-minutes`
  # (a reusable-workflow CALL job structurally cannot carry one). scan-pr has had
  # both properties since it moved to the reusable workflow. The reusable full
  # scan defaults to `-r ./` — the same recursive scan the binary ran.
  scan-scheduled:
    name: full scan
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      fail-on-vuln: false # report-only signal for now; flip to blocking once tuned
    permissions:
      security-events: write # upload the SARIF to Security > Code scanning
      contents: read # checkout + read the lockfile
      actions: read # read run metadata for the SARIF upload
