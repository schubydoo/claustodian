# Task 3.5 — Regenerate the dataset from the official CHANGELOG.md and open a
# PR with any changes. Merging is manual and always has been: this workflow
# enables no auto-merge, so a green validate-pr is a precondition for merging
# the PR, never a trigger for it. Changelog-sourced data is authoritative, but
# the other lanes feeding the same run are not self-checking — a docs-lane
# parser that quietly stops matching an upstream page yields a green PR that
# guts a lane. Read the diff.
#
# NOTE: the FIRST run produces a large PR — the initial full backfill that
# replaces the curated seed with the complete changelog-derived dataset
# (~335 versions). Review that one carefully; subsequent runs are incremental
# (a new release adds one version file and updates index.json/latest.json).
name: Update dataset from changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Claude Code version(s) to scrape the binary for, space- or comma-separated (e.g. 2.1.214, or 2.1.242 2.1.243 2.1.245). Defaults to data/index.json latest.'
        required: false
        type: string
      force:
        description: 'Re-scrape versions already in binary-cache/ (after an extractor fix). Without it a cached version is skipped, so a backfill of history is a no-op.'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [new-release]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Mint a claustodian-ci App token so the PR is opened by the App, not
      # github-actions[bot]. GITHUB_TOKEN-created PRs do NOT trigger other
      # workflows (a deliberate GitHub loop-guard), so a bot PR opened with it
      # would never fire validate-pr / security and would sit un-mergeable. The
      # App token has no such restriction, so the PR gets its required checks.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTODIAN_CI_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTODIAN_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keep the binary lane current automatically. The hourly detector passes the
      # new release version; download just that ONE release's compiled binary
      # (~250 MB from the CDN — not the 139 GB maintainer-local archive), verify it
      # against the release manifest, and extract it into the committed binary-cache/.
      # A CDN hiccup must never block the authoritative changelog update — the
      # re-distill below then simply reproduces the existing evidence unchanged. That
      # tolerance now lives in the script block rather than in `continue-on-error`,
      # because the step gained a failure mode that must NOT be tolerated: a control-
      # lane refusal is deterministic and drops the release's whole cache entry.
      # `continue-on-error` cannot tell the two apart — it swallows every non-zero.
      #
      # A manual dispatch may name SEVERAL versions, with `force` to re-scrape ones
      # already cached. That is how history is corrected after an extractor fix: one
      # run, one PR, oldest to newest. Dispatching one version per run does not work
      # for that — the branch is rebuilt from main each run, so a second dispatch
      # overwrites the first, and a cached version is skipped without `force`.
      - name: Scrape the release binaries into the cache
        id: scrape
        env:
          # Via env, never interpolated into the shell command — the inputs are
          # attacker-controllable (workflow_dispatch), so `${{ }}` in `run:` would
          # be a template-injection sink. Each version is checked here as a strict
          # major.minor.patch and re-validated by scrape-binary. Empty (e.g.
          # repository_dispatch) → index latest.
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          scrape() {
            set +e
            npm run scrape-binary -- "$@"
            code=$?
            set -e
            # 2 is a control-lane refusal: deterministic, recurs on retry, and it drops
            # this release's WHOLE cache entry rather than just its control symbols.
            # Fatal. Anything else is treated as the transient CDN failure this step has
            # always tolerated: warn, and let the re-distill reproduce existing evidence.
            if [ "$code" = "2" ]; then
              echo "::error::an extraction lane refused this release; its binary cache entry was not written"
              exit 2
            fi
            if [ "$code" != "0" ]; then
              # A forced run corrects history. A version it fails to rewrite keeps
              # its OLD evidence, and a green PR carrying the other versions would
              # read as the whole range corrected. Fatal. Without force the failure
              # is the transient CDN hiccup this step has always tolerated: warn,
              # and let the re-distill reproduce the existing evidence.
              if [ "$INPUT_FORCE" = "true" ]; then
                echo "::error::binary scrape failed (exit $code) during a forced correction; the range would be left partly corrected"
                exit "$code"
              fi
              echo "::warning::binary scrape failed (exit $code) — treating as transient; evidence unchanged"
              return 1
            fi
          }
          scraped=""
          skipped=""
          failed=""
          # Commas become spaces, then the list is word-split on purpose.
          # shellcheck disable=SC2046
          set -- $(printf '%s' "$INPUT_VERSION" | tr ',' ' ')
          if [ -n "$INPUT_VERSION" ] && [ "$#" -eq 0 ]; then
            echo "::error::the version input holds separators but no version: '$INPUT_VERSION'"
            exit 1
          fi
          if [ "$#" -eq 0 ]; then
            # No explicit list (repository_dispatch): the index latest, as before.
            set -- "$(node -p "require('./data/index.json').latest" | tr -d '\n')"
          fi
          # Reject the whole list before downloading anything, so a typo in the
          # last entry does not cost the earlier downloads.
          for v in "$@"; do
            if ! printf '%s\n' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::not a strict major.minor.patch version: $v"
              exit 1
            fi
          done
          for v in "$@"; do
            # scrape-binary skips a cached version without --force and exits 0.
            # Name that outcome; do not report the version as freshly scraped.
            if [ "$INPUT_FORCE" != "true" ] && [ -e "binary-cache/$v.json" ]; then
              echo "::notice::$v is already in binary-cache/; pass force=true to re-scrape it"
              skipped="$skipped $v"
              continue
            fi
            if [ "$INPUT_FORCE" = "true" ]; then
              scrape --version "$v" --force
              scraped="$scraped $v"
            elif scrape --version "$v"; then
              scraped="$scraped $v"
            else
              failed="$failed $v"
            fi
          done
          {
            echo "scraped=${scraped# }"
            echo "skipped=${skipped# }"
            echo "failed=${failed# }"
            echo "force=$INPUT_FORCE"
          } >> "$GITHUB_OUTPUT"
      # Re-distill data/binary-observations.json + binary-descriptions.json from the
      # committed cache (no binaries needed). Runs every time so the evidence always
      # matches the cache, whether or not the scrape step above added a version.
      - name: Re-distill binary evidence from the cache
        run: npm run backfill-binary
      # Regenerate the docs lane from the official pages in this same run, so the
      # scrape enriches against freshly-fetched official docs — a hand-edited
      # committed data/docs.json can't reach the shipped dataset via this bot.
      - name: Refresh docs index from official pages
        run: npm run fetch-docs
      - name: Scrape changelog into data/
        run: npm run scrape -- --all
      - name: Validate regenerated data
        run: npm run validate
      # Blocking here: the dataset was just regenerated from the live changelog in
      # this run, so it must cover every changelog symbol. This is the drift gate
      # (moved off per-PR validate, where it wrongly failed unrelated PRs on any
      # upstream release).
      - name: Verify regenerated dataset covers the changelog
        run: npm run coverage
      # Surface the Claude Code version this run targets (latest.json is the
      # freshly regenerated snapshot) so it lands in the PR title / commit / squash.
      # `tr -d '\n'` strips the newline `node -p` prints, keeping GITHUB_OUTPUT's
      # `key=value` line well-formed even though $() also trims trailing newlines.
      - name: Read Claude Code version
        id: cc-version
        run: echo "version=$(node -p "require('./data/latest.json').claudeCodeVersion" | tr -d '\n')" >> "$GITHUB_OUTPUT"
      # The title says what the run DID, not only where the dataset ended up. A
      # backfill of several versions used to be titled as an ordinary update, and
      # `latest.json` is always the changelog tip whichever binaries were scraped, so
      # the title was the only place the re-scraped versions could be read from —
      # and it did not carry them.
      - name: Compose pull request title
        id: pr-title
        env:
          SCRAPED: ${{ steps.scrape.outputs.scraped }}
          FORCE: ${{ steps.scrape.outputs.force }}
          VERSION: ${{ steps.cc-version.outputs.version }}
        run: |
          # shellcheck disable=SC2086 # word-split the space-separated list on purpose
          set -- $SCRAPED
          title="chore(data): update dataset for Claude Code v$VERSION"
          if [ "$#" -ge 1 ] && { [ "$#" -gt 1 ] || [ "$FORCE" = "true" ]; }; then
            first=$1
            for last in "$@"; do :; done
            span=$first
            unit=binary
            if [ "$first" != "$last" ]; then
              span="$first to $last"
              unit=binaries
            fi
            title="chore(data): re-scrape $# $unit ($span), dataset at Claude Code v$VERSION"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/changelog-update
          base: main
          title: ${{ steps.pr-title.outputs.title }}
          commit-message: ${{ steps.pr-title.outputs.title }}
          body: |
            Automated update from the official `CHANGELOG.md`
            (`provenance: changelog`, `confidence: high`).

            Latest Claude Code version in this run: **v${{ steps.cc-version.outputs.version }}**.

            Binaries scraped into `binary-cache/` in this run: `${{ steps.scrape.outputs.scraped || 'none' }}`
            (force re-scrape of cached versions: `${{ steps.scrape.outputs.force }}`).
            Requested but already cached, left as they were: `${{ steps.scrape.outputs.skipped || 'none' }}`.
            Requested but not scraped, transient failure, old evidence kept: `${{ steps.scrape.outputs.failed || 'none' }}`.
            `latest.json` follows the changelog tip regardless of which binaries were
            scraped; only the versions scraped in this run have fresh binary evidence.

            Generated by `npm run scrape -- --all`. Review the diff before merge.
          labels: automated, changelog
