# Task 3.2 — Publish /data to GitHub Pages on every push to the default branch.
# JSON is served as-is; YAML/TOML are generated in CI (they are gitignored and
# never committed). Deploy uses GitHub's OIDC-based deploy-pages (no stored
# credential). NOTE: assumes the default branch is `main` — change if the repo
# uses `master`. This workflow only runs once the repo is pushed to GitHub with
# Pages enabled (Settings -> Pages -> Source: GitHub Actions).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schema/**'
      - 'site/**'
      # Explicit because dot-directories are the kind of path a glob quietly skips;
      # site/** almost certainly covers it, and a missed deploy here is silent.
      - 'site/.well-known/**'
      - 'assets/logo/favicon.svg'
      - 'assets/og/og-image.png'
      - 'llms.txt'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Generate YAML/TOML exports
        run: npm run generate-exports
      # Cross-version catalog powering the site's "Search all versions" mode.
      # Written to data/catalog.json (gitignored) so the assemble step below picks
      # it up with the rest of data/.
      - name: Build cross-version catalog
        run: npm run build-catalog
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r data _site/data
          if [ -f site/index.html ]; then cp site/index.html _site/index.html; fi
          # Maintainer triage view at <pages-url>/review/. Reads the same published
          # data/, so it refreshes with every deploy and stores nothing server-side.
          if [ -f site/review/index.html ]; then
            mkdir -p _site/review
            cp site/review/index.html _site/review/index.html
          fi
          # Favicon referenced by index.html as href="favicon.svg" (site root).
          if [ -f assets/logo/favicon.svg ]; then cp assets/logo/favicon.svg _site/favicon.svg; fi
          # Social card. index.html points og:image at the ABSOLUTE
          # https://claustodian.dev/og-image.png, so the file has to land at the
          # site root under exactly that name. Source page: assets/og/card.html
          # (not published — only the render is).
          if [ -f assets/og/og-image.png ]; then cp assets/og/og-image.png _site/og-image.png; fi
          # llms.txt at the site root so agents can fetch <pages-url>/llms.txt.
          if [ -f llms.txt ]; then cp llms.txt _site/llms.txt; fi
          # robots.txt and sitemap.xml must sit at the site ROOT to be honoured at
          # all. robots.txt also overrides the placeholder the CDN serves by default,
          # which carries no directives.
          if [ -f site/robots.txt ]; then cp site/robots.txt _site/robots.txt; fi
          if [ -f site/sitemap.xml ]; then cp site/sitemap.xml _site/sitemap.xml; fi
          # /.well-known/ is a fixed-path discovery directory (RFC 8615), so it only
          # works at the site ROOT. Whether Pages serves a dot-directory at all is the
          # open question this copy exists to answer — Jekyll excludes dot-paths at
          # build time, but this deploy uploads an artifact and never runs Jekyll.
          if [ -d site/.well-known ]; then cp -r site/.well-known _site/.well-known; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token for the deploy-pages action
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
