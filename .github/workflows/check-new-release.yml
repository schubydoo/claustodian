# Task 3.4 — Hourly trigger. Polls the GitHub Releases Atom feed (unauthenticated,
# not subject to the REST rate limit) for a new Claude Code version and, when the
# latest tag differs from data/index.json's `latest`, triggers the update workflow.
#
# NOTE: dispatching another workflow requires a token other than GITHUB_TOKEN —
# the default token deliberately does NOT re-trigger workflows, so it cannot
# start update-from-changelog on its own. We mint a short-lived claustodian-ci
# App token with "Actions: write" for the dispatch (same App as the rest of CI),
# so no standalone PAT is needed.
name: Check for new Claude Code release

on:
  schedule:
    - cron: '17 * * * *' # hourly at :17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare latest release to tracked version
        id: compare
        run: |
          feed="https://github.com/anthropics/claude-code/releases.atom"
          latest_tag="$(curl -sSL "$feed" \
            | grep -oE 'releases/tag/v[0-9]+\.[0-9]+\.[0-9]+' \
            | head -1 | sed 's#releases/tag/v##')"
          current="$(jq -r '.latest' data/index.json)"
          echo "latest upstream: ${latest_tag:-<none>} | tracked: ${current:-<none>}"
          if [ -n "$latest_tag" ] && [ "$latest_tag" != "$current" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "version=$latest_tag" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint GitHub App token
        id: app-token
        if: steps.compare.outputs.new == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUSTODIAN_CI_CLIENT_ID }}
          private-key: ${{ secrets.CLAUSTODIAN_CI_APP_PRIVATE_KEY }}
          # A repository_dispatch event (POST /repos/{repo}/dispatches) needs
          # Contents: write. GITHUB_TOKEN cannot send a dispatch that triggers a
          # run, so the App token is still required.
          permission-contents: write
      - name: Trigger update workflow
        if: steps.compare.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Via env, never interpolated into the shell command (template-injection
          # sink). Sourced from the releases feed under a strict vX.Y.Z regex above.
          NEW_VERSION: ${{ steps.compare.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::New release detected but the claustodian-ci App secrets are not set; cannot trigger update-from-changelog."
            exit 1
          fi
          # Send a repository_dispatch event, NOT a workflow_dispatch. This is the
          # automated origin the update workflow gates auto-merge on: a manual
          # caller can start the update workflow (workflow_dispatch) but cannot
          # produce a repository_dispatch from the Actions UI, so a manual run can
          # never auto-merge. The version rides in client_payload; jq builds the
          # JSON so $NEW_VERSION is never spliced into a string.
          jq -nc --arg v "$NEW_VERSION" \
            '{event_type: "new-release", client_payload: {version: $v}}' \
            | gh api "repos/$GITHUB_REPOSITORY/dispatches" --input -

  # Announce a failed detector run as a deduplicated GitHub issue, so a silently
  # broken hourly poll (a missing App secret, a feed change) is visible without
  # watching the Actions tab.
  notify-failure:
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/report-ci-failure
