# OSV-Scanner configuration for package-lock.json in this directory.
# Each ignore needs a reason and an expiry date. When the date passes, the
# finding comes back, and you decide again.

[[IgnoredVulns]]
# minimatch 10.2.6, pulled in only by lint tooling: eslint, @eslint/config-array
# and @typescript-eslint/typescript-estree. Their latest releases still require
# minimatch ^10, and the fix is only in 11.0.1.
id = "CVE-2026-118764" # also GHSA-g3hv-75wg-m249
# ignoreUntil, not effectiveUntil: the pinned scanner (v2.7.0) reads only this
# field for a vulnerability ignore.
ignoreUntil = 2027-02-09
reason = "Unreachable here. The bug needs optimizationLevel >= 2, and no caller sets it (default 1), checked in eslint 10.14.0, @eslint/config-array 0.23.5 and @typescript-eslint/typescript-estree 8.72.1. The patterns come only from this repo's own ESLint config. Dev tooling only, nothing ships."
