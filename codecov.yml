# Codecov config. Coverage is REPORTED here for visibility (PR comment + trend
# graphs + per-component breakdown); the enforced floor is the Vitest coverage
# threshold in vitest.config.ts (statements >= 85), run in CI by the
# `test:coverage` step in .github/workflows/validate-pr.yml on the single Ubuntu
# cell. The `project` status mirrors that floor and stays `informational: true`
# (nudge, never block — vitest is the source of truth). The `patch` status is a
# real pass/fail traffic light on new-code coverage, but is not a *required*
# check, so a red patch still leaves the merge button green unless someone adds
# `codecov/patch` to branch protection. Coverage uploads from ONE Linux cell
# (the `test:coverage` run), so flags / carryforward / report-merging aren't
# needed. Codecov ingests Vitest's v8 lcov output (coverage/lcov.info) directly.
#
# Validate before deploying changes:
#   curl -X POST --data-binary @codecov.yml https://api.codecov.io/validate

codecov:
  # CI uploads coverage even when a prior step fails (the `!cancelled()` guard on
  # the upload step), on purpose: a coverage drop should surface exactly when a
  # change breaks something. So don't gate the Codecov status on CI passing, and
  # show coverage as soon as it's uploaded.
  require_ci_to_pass: false
  notify:
    # One upload cell, so report as soon as that single build lands.
    after_n_builds: 1
    wait_for_ci: false # default is true — explicit so coverage shows immediately

coverage:
  precision: 2
  round: down # a strict floor rounds down, matching the vitest threshold gate
  range: '85...100' # red->green band tuned to a project that sits at 100%
  status:
    project:
      default:
        target: 95% # mirror the vitest statements threshold
        threshold: 1% # tolerate sub-1% drift before flagging
        informational: true # nudge, never block — vitest.config.ts is the source of truth
    patch:
      default:
        # New-code (diff) coverage gate. 80% sits above the 85% project floor's
        # intent for new code without being chronically red; the CLI plumbing is
        # already covered, so new logic should land well-tested.
        target: 80%
        threshold: 0% # no slack — new code meets the target or the status goes red
        informational: false # a real pass/fail traffic light (still a non-required check)
        if_not_found: success # docs/data-only PRs upload no diff → don't block them

# The per-line PR annotations are mostly visual clutter; the comment + dashboard
# carry the signal.
github_checks:
  annotations: false

comment:
  # Single cell (no flags), so show the per-component breakdown instead of an
  # empty flags panel.
  layout: 'condensed_header, diff, components, files'
  behavior: default # update the existing comment in place
  require_changes: true # only comment when coverage actually moves
  hide_project_coverage: false

# Don't count test files, the generated dataset, or the static site toward
# coverage (the vitest lcov already excludes tests; this is belt-and-suspenders).
ignore:
  - 'scripts/**/*.test.ts'
  - 'worker/**/*.test.js'
  - 'data/**'
  - 'site/**'

# Per-area coverage breakdown in the dashboard + PR comment. No `statuses` are
# defined, so components add VISIBILITY only — they do NOT create extra
# per-component PR status checks.
#
# Grouped by LANE, matching how the pipeline is actually reasoned about: each
# lane answers "what exists and when" from a different source, and they fail in
# different ways. A drop inside binary extraction means the parser lost recall
# against a new bundle shape; a drop in curated metadata means a hand-maintained
# table went stale. Those want to be legible apart.
#
# Every non-test file under scripts/ and worker/ belongs to exactly one
# component. If you add one, add it here — an unassigned file silently vanishes
# from the breakdown, which is how 13 of 19 came to be invisible before this was
# refreshed.
#
# A component only reports if vitest MEASURES the file: `coverage.include` in
# vitest.config.ts is the gate, and a component pointing at unmeasured paths
# shows nothing rather than showing zero. worker/ was added to that include at
# the same time as the components below.
component_management:
  individual_components:
    # Lane 1 — the changelog, authoritative for when a symbol appeared.
    - component_id: changelog_scraper
      name: changelog lane
      paths:
        - scripts/scrape-changelog.ts

    # Lane 2 — the official docs pages, authoritative for what a symbol means.
    - component_id: docs_lane
      name: docs lane
      paths:
        - scripts/fetch-docs.ts

    # Lane 3a — reading symbols out of a release bundle. The recall-critical
    # half: every extractor defect this project has shipped lived here.
    #
    # control-lane.ts sits here rather than under policy even though it decides
    # its own family membership, for the same reason env-registry.ts does: what
    # can go wrong with it is recall against a bundle shape it has not seen, and
    # that is the failure this grouping exists to make legible.
    - component_id: binary_extraction
      name: binary lane (extraction)
      paths:
        - scripts/extract-bundle.ts
        - scripts/settings-schema.ts
        - scripts/env-registry.ts
        - scripts/argv-scopes.ts
        - scripts/control-lane.ts
        - scripts/slice-bundle.ts

    # Lane 3b — interpreting that evidence: what may publish, how it is
    # categorized, how per-version windows are distilled.
    - component_id: binary_policy
      name: binary lane (policy)
      paths:
        - scripts/binary-lane.ts
        - scripts/backfill-binary.ts

    # Lane 3c — acquiring the bundles. Network and checksum plumbing, not logic.
    - component_id: binary_acquisition
      name: binary lane (acquisition)
      paths:
        - scripts/scrape-binary.ts
        - scripts/reextract-binaries.ts

    # Hand-maintained tables the lanes consult. These rot rather than break, so
    # their coverage is about the accessors staying honest.
    - component_id: curated_metadata
      name: curated metadata
      paths:
        - scripts/symbol-scopes.ts
        - scripts/removals.ts

    - component_id: schema_validation
      name: schema & validation
      paths:
        - scripts/validate-schema.ts

    - component_id: exports
      name: export generation
      paths:
        - scripts/generate-exports.ts
        - scripts/build-catalog.ts

    - component_id: dataset_tools
      name: dataset tools (diff / coverage / removals)
      paths:
        - scripts/diff-snapshots.ts
        - scripts/check-coverage.ts
        - scripts/find-removals.ts

    - component_id: shared
      name: shared helpers
      paths:
        - scripts/lib.ts

    # The edge, not the pipeline. These run on Cloudflare in front of the
    # published site rather than building the dataset, and they fail in a way no
    # other component does: a defect here is visible to every visitor
    # immediately, with no regeneration or deploy of data involved.
    - component_id: worker_negotiation
      name: worker (content negotiation)
      paths:
        - worker/index.js

    - component_id: worker_mcp
      name: worker (MCP server)
      paths:
        - worker/mcp.js
